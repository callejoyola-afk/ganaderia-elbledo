<style>

<script>
'use strict';

var VERSION = '1.1.2';
var SB_URL = 'https://hwvufzeayumqjxjtebvp.supabase.co';
var TOPE_H = 7;
var LS_KEY='eb_key', LS_YO='eb_yo', LS_DATOS='eb_datos', LS_COLA='eb_cola', LS_DESC='eb_desc', LS_SYNC='eb_sync', LS_DOM='eb_dom';
var PG_NEG = ['P0001','23505','23514','23503','42501','22P02','42703'];
var MOT_RECH = ['Las horas no corresponden','Está repetida','Ese día no se trabajó ahí'];
var UNIDADES = ['kg','bulto','litro','unidad'];
var SERIES = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4'];
var OTROS_C = '#B9B2A0';
var ACT_ICONOS = {
  'Arreglo de cercas':'M4 20V6l2-2 2 2v14M16 20V6l2-2 2 2v14M8 9h8M8 15h8',
  'Agua y bebederos':'M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z',
  'Mover el ganado':'M4 12a8 8 0 0 1 14-5l2 2M20 4v5h-5M20 12a8 8 0 0 1-14 5l-2-2M4 20v-5h5',
  'Vacunar o curar':'M18 2l4 4M20 4l-9 9M14 5l5 5M6 13l5 5-3 3-5-5zM3 21l2-2',
  'Limpieza de potrero':'M3 21c6-1 10-5 11-12M7 21c3-4 4-8 3-13M12 21c1-5 4-9 9-11',
  'Sal y comida':'M3 11h18a9 9 0 0 1-18 0zM8 7c0-2 1-3 2-4M13 7c0-2 1-3 2-4',
  'Ronda y conteo':'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6z',
  'Otra labor':'M5 12h.01M12 12h.01M19 12h.01M3 3h18v18H3z'
};
var TAB_D = {
  aprobar:'M20 6 9 17l-5-5', agregar:'M12 5v14M5 12h14',
  ganado:'M5 9c0-2 1.5-4 4-4h6c2.5 0 4 2 4 4v5a5 5 0 0 1-5 5h-4a5 5 0 0 1-5-5zM5 8 2 5M19 8l3-3M9.5 12h.01M14.5 12h.01M10 16h4',
  socios:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',
  bodega:'M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',
  hoy:'M12 6v6l4 2M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z',
  inversion:'M3 3v18h18M7 15l4-4 3 3 5-6'
};

/* ─── Estado ─── */
var sb = null;
var yo = null, dominio = '';
var datos = {actividades:[],potreros:[],labores:[],personas:[],ganadoLotes:[],ganadoHist:{},capitalPersona:[],stock:[],config:{},jornales:[],alertas:[]};
var cola = [], descarte = [];
var ultimoSync = {};
var E = {pantalla:'cargando',tab:'hoy',subAg:null,paso:'inicio',selAct:null,selPot:null,rechazando:null,corrigiendo:null,desactivando:null,gAcc:null,gLote:null,gVer:null,gNuevo:false,movProd:null,movTipo:null,selSocio:null,f:{},aviso:'',avisoOk:false};
var flushing = false, timerR = 0;

/* ─── Utilidades ─── */
function uuid(){return crypto.randomUUID()}
function esc(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function aCorreo(t,d){return t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'.').replace(/[^a-z0-9._-]/g,'')+'@'+d}
function fechaBog(){var d=new Date(),b=new Date(d.toLocaleString('en-US',{timeZone:'America/Bogota'}));return b.getFullYear()+'-'+p2(b.getMonth()+1)+'-'+p2(b.getDate())}
function p2(n){return n<10?'0'+n:''+n}
function isoNow(){return new Date().toISOString()}
function pesos(n){return n==null||isNaN(n)?'s/d':'$'+Math.round(n).toLocaleString('es-CO')}
function minEntre(a,b){return !a||!b?0:Math.max(Math.floor((new Date(b)-new Date(a))/60000),0)}
function durM(m){if(!m||m<1)return'menos de 1 min';var h=Math.floor(m/60),r=m%60;return h?(h+' h'+(r?' '+r+' min':'')):(r+' min')}
function horaC(iso){if(!iso)return'';var d=new Date(iso),h=d.getHours(),m=d.getMinutes(),s=h<12?'a. m.':'p. m.';return(h%12||12)+':'+p2(m)+' '+s}
function fechaTxt(iso){if(!iso)return'';var M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],p=iso.split('-');return parseInt(p[2],10)+' '+M[parseInt(p[1],10)-1]}
function fechaLarga(iso){if(!iso)return'';var D=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],M=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],d=new Date(iso+'T12:00:00');return D[d.getDay()].charAt(0).toUpperCase()+D[d.getDay()].slice(1)+' '+d.getDate()+' de '+M[d.getMonth()]}
function kgT(n){return(Math.round(n*10)/10).toLocaleString('es-CO')+' kg'}
function numP(v){return parseFloat(String(v).replace(/\./g,'').replace(',','.'))||0}
function ico(d,w,c){c=c||'currentColor';return'<svg width="'+w+'" height="'+w+'" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="'+d+'"></path></svg>'}
function icoAct(n){return ACT_ICONOS[n]||'M12 5v14M5 12h14'}
function genClave(){return'campo-'+Math.floor(1000+Math.random()*9000)}
function nomAct(id){var a=datos.actividades.find(function(x){return x.id===id});return a?a.valor:'Labor'}
function nomPot(id){if(!id)return'General';var p=datos.potreros.find(function(x){return x.id===id});return p?p.nombre:'Potrero'}
function nomPers(id){var p=datos.personas.find(function(x){return x.id===id});return p?p.nombre:'Socio'}

/* ─── Almacenamiento local ─── */
function guardar(){try{localStorage.setItem(LS_COLA,JSON.stringify(cola));localStorage.setItem(LS_DESC,JSON.stringify(descarte));localStorage.setItem(LS_DATOS,JSON.stringify(datos));localStorage.setItem(LS_SYNC,JSON.stringify(ultimoSync));if(yo)localStorage.setItem(LS_YO,JSON.stringify(yo))}catch(e){}}
function cargar(){try{var c=localStorage.getItem(LS_COLA);if(c)cola=JSON.parse(c);var d=localStorage.getItem(LS_DESC);if(d)descarte=JSON.parse(d);var dt=localStorage.getItem(LS_DATOS);if(dt)Object.assign(datos,JSON.parse(dt));var s=localStorage.getItem(LS_SYNC);if(s)ultimoSync=JSON.parse(s);var y=localStorage.getItem(LS_YO);if(y)yo=JSON.parse(y);dominio=localStorage.getItem(LS_DOM)||''}catch(e){}}

/* ─── Cola offline ─── */
function encolar(tabla,op,id,payload,deps){
  var item={id_local:uuid(),tabla:tabla,op:op,id:id,payload:payload,deps:deps||[],estado:'pend',error:null,ts:Date.now()};
  cola.push(item);
  aplicarLocal(tabla,op,id,payload);
  guardar(); render(); flush();
  return item.id_local;
}
function aplicarLocal(tabla,op,id,payload){
  if(tabla==='labores'){
    if(op==='crear'){datos.labores.push(Object.assign({id:id},payload,{estado:'pendiente',alertas:[]}))}
    else if(op==='editar'){var i=datos.labores.findIndex(function(l){return l.id===id});if(i>=0)Object.assign(datos.labores[i],payload)}
  }
}
function clasificar(res){
  if(!res)return'red';
  if(res.error){var c=res.error.code||'',s=res.status||0;
    if(s===401)return'auth';if(s===0||s===408||s===429||s>=500)return'red';
    if(PG_NEG.indexOf(c)>=0)return'negocio';if(s>=400)return'negocio';}
  return'ok';
}
function ejecutar(item){
  if(!sb)return Promise.resolve({error:{message:'Sin conexión'},status:0});
  if(item.op==='crear'){
    return sb.from(item.tabla).upsert([Object.assign({id:item.id},item.payload)],{onConflict:'id',ignoreDuplicates:true}).select('id').then(function(r){return{data:r.data,error:r.error,status:r.error?(r.error.status||400):200}});
  }
  if(item.op==='editar'){
    return sb.from(item.tabla).update(item.payload).eq('id',item.id).select('id').then(function(r){
      if(!r.error&&(!r.data||r.data.length===0))return{data:r.data,error:{message:'El servidor no aplicó el cambio. Puede que no tenga permiso o el registro no existe.',code:'no_visible'},status:400};
      return{data:r.data,error:r.error,status:r.error?(r.error.status||400):200};
    });
  }
  if(item.op==='anular'){
    var p=Object.assign({deleted_at:isoNow()},item.payload);
    return sb.from(item.tabla).update(p).eq('id',item.id).select('id').then(function(r){
      if(!r.error&&(!r.data||r.data.length===0))return{data:r.data,error:{message:'No se pudo anular.',code:'no_visible'},status:400};
      return{data:r.data,error:r.error,status:r.error?(r.error.status||400):200};
    });
  }
  return Promise.resolve({error:{message:'Operación desconocida'},status:400});
}
function arrastrar(idL){
  cola.forEach(function(i){
    if(i.estado==='pend'&&i.deps.indexOf(idL)>=0){i.estado='revisar';i.error='Depende de un registro que falló.';arrastrar(i.id_local)}
  });
}
function flush(){
  if(flushing||!sb)return;flushing=true;
  var t0=Date.now();
  function paso(){
    var idx=cola.findIndex(function(i){return i.estado==='pend'});
    if(idx<0){flushing=false;guardar();return}
    var item=cola[idx];
    if(item.deps.some(function(d){return cola.some(function(c){return c.id_local===d&&c.estado==='pend'})})){flushing=false;guardar();return}
    if(item.deps.some(function(d){return cola.some(function(c){return c.id_local===d&&c.estado==='revisar'})})){
      item.estado='revisar';item.error='Depende de un registro que no se pudo enviar.';guardar();render();paso();return;
    }
    item.estado='enviando';
    ejecutar(item).then(function(res){
      var tipo=clasificar(res);
      if(tipo==='ok'){cola.splice(cola.indexOf(item),1)}
      else if(tipo==='red'){item.estado='pend';flushing=false;guardar();return}
      else if(tipo==='auth'){item.estado='pend';E.pantalla='login';E.aviso='Su sesión expiró. Entre de nuevo.';flushing=false;guardar();render();return}
      else{item.estado='revisar';item.error=res.error?res.error.message:'Error desconocido';arrastrar(item.id_local)}
      guardar();render();
      if(Date.now()-t0<8000)paso();else flushing=false;
    }).catch(function(e){item.estado='pend';flushing=false;guardar()});
  }
  paso();
}
function nPend(){return cola.filter(function(i){return i.estado==='pend'||i.estado==='enviando'}).length}
function nRev(){return cola.filter(function(i){return i.estado==='revisar'}).length}

/* ─── Sincronización ─── */
function refrescar(){
  if(!sb||!yo)return Promise.resolve();
  var prom=[];
  function sinc(nombre,from,filtro,campo){
    var q=sb.from(from).select('*');q=filtro(q);
    var ult=ultimoSync[nombre];
    if(ult){var desde=new Date(new Date(ult).getTime()-300000).toISOString();q=q.gte('updated_at',desde)}
    return q.then(function(r){
      if(!r.error&&r.data&&r.data.length>0){
        if(!ult){datos[campo]=r.data}
        else{var m=new Map(datos[campo].map(function(x){return[x.id,x]}));r.data.forEach(function(x){m.set(x.id,x)});datos[campo]=Array.from(m.values())}
      }
      ultimoSync[nombre]=new Date().toISOString();
    }).catch(function(){});
  }
  prom.push(sinc('actividades','catalogos',function(q){return q.eq('tipo','actividad').order('orden')},'actividades'));
  prom.push(sinc('potreros','potreros',function(q){return q.eq('activo',true).order('codigo')},'potreros'));
  prom.push(sinc('jornales','jornales',function(q){return q.order('anio',{ascending:false})},'jornales'));
  if(yo.rol==='admin'||yo.rol==='revisor'){
    prom.push(sinc('personas','personas',function(q){return q.order('nombre')},'personas'));
    prom.push(sb.from('v_ganado_lote').select('*').then(function(r){if(!r.error&&r.data)datos.ganadoLotes=r.data}).catch(function(){}));
    prom.push(sb.from('v_capital_persona').select('*').then(function(r){if(!r.error&&r.data)datos.capitalPersona=r.data}).catch(function(){}));
    prom.push(sb.from('v_stock').select('*').then(function(r){if(!r.error&&r.data)datos.stock=r.data}).catch(function(){}));
  }
  var hoy=fechaBog();
  var qL=sb.from('labores').select('*');
  if(yo.rol==='socio')qL=qL.eq('persona_id',yo.persona_id);
  prom.push(qL.gte('fecha',hoy.slice(0,8)+'01').is('deleted_at',null).order('fecha',{ascending:false}).limit(200).then(function(r){
    if(r.data){
      var rescate=datos.labores.slice();
      if(datos.labores.length>10&&r.data.length===0){console.warn('Respuesta sospechosa: 0 labores donde había muchas.')}
      else{var m=new Map(r.data.map(function(l){return[l.id,l]}));datos.labores.filter(function(l){return!m.has(l.id)&&cola.some(function(c){return c.id===l.id&&c.estado==='pend'})}).forEach(function(l){m.set(l.id,l)});datos.labores=Array.from(m.values())}
    }
  }).catch(function(){}));
  prom.push(sb.rpc('mis_alertas').then(function(r){if(r.data)datos.alertas=r.data}).catch(function(){}));
  prom.push(sb.from('config').select('*').limit(50).then(function(r){if(r.data){var m={};r.data.forEach(function(c){m[c.clave]=c.valor});datos.config=m}}).catch(function(){}));
  return Promise.all(prom).then(function(){guardar();render()}).catch(function(){});
}

/* ─── Conexión ─── */
function conectar(clave){
  if(!clave)return null;
  return supabase.createClient(SB_URL,clave,{global:{headers:{'x-app-ver':VERSION}},auth:{persistSession:true,storageKey:'eb_auth',autoRefreshToken:true}});
}

/* ─── Render ─── */
var $app=document.getElementById('app');
function render(){clearTimeout(timerR);timerR=setTimeout(_render,16)}
function _render(){$app.innerHTML=R()}
function R(){
  switch(E.pantalla){
    case 'cargando':return rCargando();case 'setup':return rSetup();case 'instalar':return rInstalar();
    case 'login':return rLogin();case 'socio':return rSocio();case 'admin':return rAdmin();
    case 'revisor':return rRevisor();case 'revisar':return rBandeja();case 'cuenta':return rCuenta();
    default:return'<div class="centro"><p>Error</p></div>';
  }
}
function chipSync(){
  var n=nPend(),r=nRev(),t=n?n+' por enviar':'Todo enviado';if(r)t+=' · '+r+' para revisar';
  var bg=n?'background:#FBEBD0;color:#6B4A10':(r?'background:#F6DDD8;color:#8A2A1B':'background:#DDEEDF;color:#14492A');
  return'<span class="sync-chip" style="'+bg+'" data-a="ir_revisar">'+esc(t)+'</span>';
}
function avisoH(){if(!E.aviso)return'';return'<div class="'+(E.avisoOk?'aviso-ok':'aviso')+'" role="status">'+esc(E.aviso)+'</div>'}
function cabSocio(){
  return'<header class="cab" style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">'+

    UNIDADES.map(function(u){var on=(E.f.f_iun||'kg')===u;return'<button data-a="sel_un" data-p="'+u+'" style="height:48px;border-radius:12px;font-size:16px;font-weight:700;color:#1B2A1F;'+(on?'background:#DDEEDF;border:3px solid #1E6B3A':'background:#FFF;border:1px solid #B9B2A0')+'">'+u+'</button>'}).join('')+
    '</div><button class="btn-v" style="height:52px" data-a="agregar_prod">Agregar producto</button></div>';
  prods.forEach(function(p){
    var mov=E.movProd===p.producto_id;
    h+='<div class="tarj col"><div class="entre"><span style="font-size:18px;font-weight:700">'+esc(p.nombre)+'</span><span style="font-size:18px"><b>'+(p.stock!=null?p.stock:0)+'</b> '+esc(p.unidad)+'</span></div>';
    if(!mov&&!sl)h+='<div class="g2"><button data-a="inv_abrir" data-p="'+p.producto_id+'" data-p2="entrada" style="min-height:48px;border-radius:14px;border:0;background:#DDEEDF;color:#14492A;font-size:17px;font-weight:700">+ Entró</button><button data-a="inv_abrir" data-p="'+p.producto_id+'" data-p2="salida" style="min-height:48px;border-radius:14px;border:0;background:#FBEBD0;color:#4A3209;font-size:17px;font-weight:700">− Salió</button></div>';
    if(mov)h+='<div class="col" style="gap:8px"><span style="font-size:16px;font-weight:700">'+(E.movTipo==='entrada'?'¿Cuánto entró?':'¿Cuánto salió?')+'</span><div class="g4">'+
      [1,5,10,25].map(function(n){return'<button data-a="inv_cant" data-p="'+p.producto_id+'" data-p2="'+n+'" style="height:52px;border-radius:14px;border:1px solid #B9B2A0;background:#F4F1E8;font-size:18px;font-weight:700;color:#1B2A1F">'+n+'</button>'}).join('')+
      '</div><button data-a="inv_cancel" style="height:44px;border:0;background:transparent;font-size:16px;color:#5B6B5F;text-decoration:underline">Cancelar</button></div>';
    h+='</div>';
  });
  h+='</div>';return h;
}

/* ─── Bandeja Revisar ─── */

  var h='<div class="pant"><header class="cab"><h1 style="font-size:24px">Revisar ('+items.length+')</h1><button class="link-btn" data-a="volver" style="margin-top:8px">← Volver</button></header><div class="main">';
  if(!items.length)h+='<div class="centro"><span class="sub">No hay registros para revisar.</span></div>';
  items.forEach(function(it){
    h+='<div class="tarj col"><div class="entre"><span style="font-size:17px;font-weight:700">'+esc(it.tabla)+' · '+esc(it.op)+'</span><span class="chip chip-no">Error</span></div>'+
      '<p style="font-size:15px;color:#8A2A1B">'+esc(it.error)+'</p>'+
      '<pre style="font-size:12px;background:#F4F1E8;padding:8px;border-radius:8px;overflow-x:auto;white-space:pre-wrap">'+esc(JSON.stringify(it.payload,null,2))+'</pre>'+
      '<div class="g2"><button data-a="descartar" data-p="'+it.id_local+'" style="min-height:48px;border-radius:14px;border:2px solid #8A2A1B;background:transparent;color:#8A2A1B;font-size:16px;font-weight:700">Descartar</button>'+
      '<button data-a="reintentar" data-p="'+it.id_local+'" style="min-height:48px;border-radius:14px;border:0;background:#1E6B3A;color:#FFF;font-size:16px;font-weight:700">Reintentar</button></div></div>';

}

/* ─── Eventos ─── */
$app.addEventListener('input',function(e){if(e.target.dataset.campo)E.f[e.target.dataset.campo]=e.target.value});
$app.addEventListener('click',function(e){
  var btn=e.target.closest('[data-a]');if(!btn)return;var a=btn.dataset.a,p=btn.dataset.p,p2=btn.dataset.p2;
  switch(a){
  case'guardar_key':var k=(E.f.f_key||'').trim();if(!k||k.length<20){E.aviso='Pegue la clave completa.';render();return}localStorage.setItem(LS_KEY,k);E.aviso='';arrancar();return;
  case'cambiar_key':localStorage.removeItem(LS_KEY);E.pantalla='setup';E.aviso='';render();return;
  case'instalar':hInstalar();return;
  case'entrar':hEntrar();return;
  case'ir_tab':E.tab=p;E.aviso='';E.rechazando=null;E.corrigiendo=null;E.gAcc=null;E.movProd=null;E.subAg=null;E.paso='inicio';render();return;
  case'ir_revisar':E.pantalla='revisar';render();return;
  case'ir_cuenta':E.pantalla='cuenta';render();return;
  case'volver':if(yo){E.pantalla=yo.rol==='admin'?'admin':(yo.rol==='revisor'?'revisor':'socio')}else E.pantalla='login';render();return;
  case'sub_ag':E.subAg=p;render();return;
  case'empezar_flujo':E.paso='actividad';E.selAct=null;E.selPot=null;E.aviso='';render();return;
  case'cancel_flujo':E.paso='inicio';render();return;
  case'sel_act':E.selAct=p;E.paso='potrero';render();return;
  case'paso_act':E.paso='actividad';render();return;
  case'sel_pot':E.selPot=p;E.paso='confirmar';render();return;
  case'empezar':hEmpezar();return;
  case'terminar':hTerminar();return;
  case'aprobar_lab':encolar('labores','editar',p,{estado:'aprobada'});E.aviso='Aprobada.';E.avisoOk=true;return;
  case'aprobar_todas':datos.labores.filter(function(l){return l.estado==='pendiente'&&l.fin&&!l.deleted_at}).forEach(function(l){encolar('labores','editar',l.id,{estado:'aprobada'})});E.aviso='Todas aprobadas.';E.avisoOk=true;return;
  case'ini_rech':E.rechazando=p;E.corrigiendo=null;E.aviso='';render();return;
  case'cancel_rech':E.rechazando=null;render();return;
  case'rechazar':encolar('labores','editar',p,{estado:'rechazada',motivo_rechazo:p2||btn.textContent.trim()});E.rechazando=null;E.aviso='Rechazada.';return;
  case'ini_cor':var lab=datos.labores.find(function(l){return l.id===p});E.corrigiendo=p;E.rechazando=null;E.f.f_cor_ini=lab&&lab.inicio?lab.inicio.slice(0,16):'';E.f.f_cor_fin=lab&&lab.fin?lab.fin.slice(0,16):'';render();return;
  case'cancel_cor':E.corrigiendo=null;render();return;
  case'guardar_cor':var ini=E.f.f_cor_ini,fin=E.f.f_cor_fin;if(!ini||!fin){E.aviso='Escriba las dos horas.';render();return}encolar('labores','editar',p,{inicio:new Date(ini).toISOString(),fin:new Date(fin).toISOString()});E.corrigiendo=null;E.aviso='Horario corregido.';return;
  case'agregar_act':hAgregarAct();return;
  case'toggle_act':var ac=datos.actividades.find(function(x){return x.id===p});if(ac){encolar('catalogos','editar',p,{activo:ac.activo===false});ac.activo=ac.activo===false;guardar();render()}return;
  case'agregar_pot':hAgregarPot();return;
  case'g_abrir':E.gAcc=p;E.gLote=p2;E.f.f_gn='';E.f.f_gkg='';E.f.f_gpre='';E.f.f_gcausa='Murió';E.aviso='';render();return;
  case'g_cerrar':E.gAcc=null;E.gLote=null;render();return;
  case'g_causa':E.f.f_gcausa=p;render();return;
  case'g_cont':E.f.f_gcont=p;render();return;
  case'g_guardar':hGGuardar(p);return;
  case'g_hist':hGHist(p);return;
  case'g_nuevo':E.gNuevo=true;E.f.f_gnom='';E.f.f_gcont='60';E.aviso='';render();return;
  case'g_cancel_n':E.gNuevo=false;render();return;
  case'g_crear':hGCrear();return;
  case'sel_dona':E.selSocio=E.selSocio===p?null:p;render();return;
  case'crear_socio':hCrearSocio();return;
  case'cambiar_rol':hCambiarRol(p,p2);return;
  case'nueva_clave':hNuevaClave(p);return;
  case'toggle_pers':if(datos.personas.find(function(x){return x.id===p&&x.activo!==false})){E.desactivando=p;render()}else{hReactivar(p)}return;
  case'desact_motivo':hDesactivar(p,p2);return;
  case'cancel_desact':E.desactivando=null;render();return;
  case'sel_un':E.f.f_iun=p;render();return;
  case'agregar_prod':hAgregarProd();return;
  case'inv_abrir':E.movProd=p;E.movTipo=p2;E.aviso='';render();return;
  case'inv_cancel':E.movProd=null;E.movTipo=null;render();return;
  case'inv_cant':hInvCant(p,parseInt(p2,10));return;
  case'descartar':var ix=cola.findIndex(function(i){return i.id_local===p});if(ix>=0){var it=cola.splice(ix,1)[0];it.estado='descarte';it.ts_desc=Date.now();descarte.push(it);arrastrar(p);guardar();render()}return;
  case'reintentar':var ri=cola.find(function(i){return i.id_local===p});if(ri){ri.estado='pend';ri.error=null;guardar();flush();render()}return;
  case'salir':hSalir();return;
  }
});

/* ─── Handlers ─── */
function hInstalar(){
  var f=E.f;if(!f.f_codigo||!f.f_nombre||!f.f_usuario||!f.f_clave){E.aviso='Llene todos los campos.';render();return}
  if(f.f_clave.length<8){E.aviso='La clave debe tener 8+ caracteres.';render();return}
  E.aviso='Creando…';render();
  sb.functions.invoke('instalar',{body:{codigo:f.f_codigo,nombre:f.f_nombre,usuario:f.f_usuario,clave:f.f_clave}}).then(function(r){
    if(r.error||(r.data&&r.data.error)){E.aviso=(r.data&&r.data.error)||r.error.message||'Error.';render();return}
    E.aviso='';E.pantalla='login';E.f={};render();
  }).catch(function(e){E.aviso=e.message||'Error de red.';render()});
}
function hEntrar(){
  var usr=(E.f.f_user||'').trim(),pass=E.f.f_pass||'';
  if(!usr||!pass){E.aviso='Escriba usuario y clave.';render();return}
  E.aviso='Entrando…';render();
  var email=aCorreo(usr,dominio);
  sb.auth.signInWithPassword({email:email,password:pass}).then(function(r){
    if(r.error){E.aviso=r.error.message==='Invalid login credentials'?'Usuario o clave incorrectos.':r.error.message;render();return}
    return sb.rpc('vincular_mi_cuenta').then(function(r2){
      if(r2.error||!r2.data||!r2.data.ok){E.aviso=r2.data&&r2.data.ok===false?'Su cuenta no está autorizada; pida acceso al administrador.':(r2.error?r2.error.message:'Error.');render();return}
      yo={persona_id:r2.data.persona_id,rol:r2.data.rol,nombre:usr};
      return sb.from('personas').select('nombre').eq('id',r2.data.persona_id).single().then(function(r3){if(r3.data)yo.nombre=r3.data.nombre}).catch(function(){}).then(function(){
        localStorage.setItem(LS_YO,JSON.stringify(yo));E.f={};E.aviso='';
        E.pantalla=yo.rol==='admin'?'admin':(yo.rol==='revisor'?'revisor':'socio');
        E.tab=yo.rol==='admin'?'aprobar':(yo.rol==='revisor'?'milabor':'hoy');
        render();refrescar();
      });
    });
  }).catch(function(e){E.aviso=e.message||'Error de red.';render()});
}
function hEmpezar(){
  if(labAbierta()){E.aviso='Ya tiene una labor abierta. Termínela primero.';E.paso='inicio';render();return}
  var id=uuid(),potId=E.selPot==='null'?null:E.selPot;
  var payload={persona_id:yo.persona_id,fecha:fechaBog(),actividad_id:E.selAct,inicio:isoNow(),potrero_id:potId,modalidad:'participacion',reparto:[]};
  encolar('labores','crear',id,payload);E.paso='inicio';E.aviso='';
}
function hTerminar(){
  var ab=labAbierta();if(!ab){E.aviso='No hay labor abierta.';render();return}
  var empItem=cola.find(function(c){return c.id===ab.id&&c.op==='crear'});
  var deps=empItem?[empItem.id_local]:[];
  encolar('labores','editar',ab.id,{fin:isoNow()},deps);
  var mt=minEntre(ab.inicio,new Date().toISOString());
  E.aviso=nomAct(ab.actividad_id)+', '+durM(mt)+'. Guardado.';E.avisoOk=true;
}
function hAgregarAct(){
  var n=(E.f.f_nact||'').trim();if(!n){E.aviso='Escriba el nombre.';render();return}
  var id=uuid();encolar('catalogos','crear',id,{tipo:'actividad',valor:n,orden:100,activo:true,extra:{}});
  datos.actividades.push({id:id,tipo:'actividad',valor:n,orden:100,activo:true,extra:{}});
  E.f.f_nact='';E.aviso='«'+n+'» agregada.';E.avisoOk=true;guardar();render();
}
function hAgregarPot(){
  var n=(E.f.f_nlote||'').trim();if(!n){E.aviso='Escriba el nombre.';render();return}
  var id=uuid(),ha=numP(E.f.f_nha)||null;
  encolar('potreros','crear',id,{codigo:n.toUpperCase(),nombre:n,area_ha:ha});
  datos.potreros.push({id:id,codigo:n.toUpperCase(),nombre:n,area_ha:ha,activo:true});
  E.f.f_nlote='';E.f.f_nha='';E.aviso='Lote «'+n+'» agregado.';E.avisoOk=true;guardar();render();
}
function hGGuardar(loteId){
  var acc=E.gAcc,n=parseInt(E.f.f_gn,10);
  if(!(n>0)){E.aviso='Escriba cuántos animales.';render();return}
  if(acc==='entrada'){
    var kg=numP(E.f.f_gkg),pre=numP(E.f.f_gpre);if(!(kg>0&&pre>0)){E.aviso='Escriba peso y precio.';render();return}
    encolar('entradas_ganado','crear',uuid(),{lote_id:loteId,fecha:fechaBog(),cabezas:n,kg_total:kg,precio_kg:pre});E.aviso='Entraron '+n+' animales.';
  }
  if(acc==='pesaje'){
    var kg2=numP(E.f.f_gkg);if(!(kg2>0)){E.aviso='Escriba el peso promedio.';render();return}
    encolar('pesajes_lote','crear',uuid(),{lote_id:loteId,fecha:fechaBog(),n_animales:n,peso_promedio_kg:kg2});E.aviso='Pesaje guardado.';
  }
  if(acc==='venta'){
    var kg3=numP(E.f.f_gkg),pre3=numP(E.f.f_gpre);if(!(kg3>0&&pre3>0)){E.aviso='Escriba peso y precio.';render();return}
    encolar('ventas','crear',uuid(),{lote_id:loteId,fecha:fechaBog(),cabezas:n,peso_total_kg:kg3,precio_kg:pre3});E.aviso='Venta guardada.';
  }
  if(acc==='baja'){
    encolar('bajas_ganado','crear',uuid(),{lote_id:loteId,fecha:fechaBog(),cabezas:n,causa:E.f.f_gcausa||'Murió'});E.aviso='Baja registrada.';
  }
  E.avisoOk=true;E.gAcc=null;E.gLote=null;
}
function hGHist(loteId){
  if(E.gVer===loteId){E.gVer=null;render();return}
  E.gVer=loteId;
  if(sb)sb.from('v_ganado_historial').select('*').eq('lote_id',loteId).order('fecha',{ascending:false}).limit(50).then(function(r){if(r.data)datos.ganadoHist[loteId]=r.data;render()}).catch(function(){render()});
  else render();
}
function hGCrear(){
  var n=(E.f.f_gnom||'').trim();if(!n){E.aviso='Escriba el nombre.';render();return}
  E.aviso='Creando…';render();
  var pct=E.f.f_gcont==='null'?null:parseInt(E.f.f_gcont,10);
  sb.rpc('lote_ganado_crear',{p_nombre:n,p_pct_empresa:pct}).then(function(r){
    if(r.error){E.aviso=r.error.message;render();return}
    E.gNuevo=false;E.aviso='Lote «'+n+'» creado. Registre los animales con «+ Entraron».';E.avisoOk=true;
    refrescar();
  }).catch(function(e){E.aviso=e.message;render()});
}
function hCrearSocio(){
  var n=(E.f.f_pnom||'').trim(),u=(E.f.f_pusr||'').trim().toLowerCase();
  if(!n||u.length<3){E.aviso='Nombre y usuario (3+ letras).';render();return}
  var clave=E.f.f_pclave||genClave();E.aviso='Creando…';render();
  sb.functions.invoke('usuarios',{body:{accion:'crear',nombre:n,usuario:u,clave:clave,rol:'socio'}}).then(function(r){
    if(r.error||(r.data&&r.data.error)){E.aviso=(r.data&&r.data.error)||r.error.message||'Error.';render();return}
    E.f.f_pnom='';E.f.f_pusr='';E.f.f_pclave='';E.aviso=n+' creado. Clave: '+clave;E.avisoOk=true;refrescar();
  }).catch(function(e){E.aviso=e.message;render()});
}
function hCambiarRol(id,rol){
  E.aviso='Cambiando…';render();
  sb.from('personas').update({rol:rol}).eq('id',id).select('id').then(function(r){
    if(r.error){E.aviso=r.error.message;render();return}
    if(!r.data||!r.data.length){E.aviso='Sin permiso.';render();return}
    var p=datos.personas.find(function(x){return x.id===id});if(p)p.rol=rol;
    E.aviso='Rol cambiado.';E.avisoOk=true;guardar();render();
  }).catch(function(e){E.aviso=e.message;render()});
}
function hNuevaClave(id){
  var c=genClave();E.aviso='Cambiando clave…';render();
  var p=datos.personas.find(function(x){return x.id===id});
  sb.functions.invoke('usuarios',{body:{accion:'restablecer_clave',persona_id:id,clave:c}}).then(function(r){
    if(r.error||(r.data&&r.data.error)){E.aviso=(r.data&&r.data.error)||r.error.message||'Error.';render();return}
    if(p)p._claveNueva=c;E.aviso='Clave: '+c+'. Désela en persona.';E.avisoOk=true;render();
  }).catch(function(e){E.aviso=e.message;render()});
}
function hDesactivar(id,motivo){
  E.aviso='Procesando…';E.desactivando=null;render();
  sb.functions.invoke('usuarios',{body:{accion:'desactivar',persona_id:id,motivo:motivo}}).then(function(r){
    if(r.error||(r.data&&r.data.error)){E.aviso=(r.data&&r.data.error)||r.error.message||'Error.';render();return}
    var p=datos.personas.find(function(x){return x.id===id});if(p)p.activo=false;
    E.aviso=p?p.nombre+' desactivado.':'Desactivado.';E.avisoOk=true;guardar();render();
  }).catch(function(e){E.aviso=e.message;render()});
}
function hReactivar(id){
  E.aviso='Procesando…';render();
  sb.functions.invoke('usuarios',{body:{accion:'reactivar',persona_id:id}}).then(function(r){
    if(r.error||(r.data&&r.data.error)){E.aviso=(r.data&&r.data.error)||r.error.message||'Error.';render();return}
    var p=datos.personas.find(function(x){return x.id===id});if(p)p.activo=true;
    E.aviso=p?p.nombre+' activado.':'Activado.';E.avisoOk=true;guardar();render();
  }).catch(function(e){E.aviso=e.message;render()});
}
function hAgregarProd(){
  var n=(E.f.f_inom||'').trim();if(!n){E.aviso='Escriba el nombre.';render();return}
  var id=uuid(),un=E.f.f_iun||'kg';
  encolar('productos','crear',id,{nombre:n,unidad:un});
  datos.stock.push({producto_id:id,nombre:n,unidad:un,stock:0});
  E.f.f_inom='';E.aviso='«'+n+'» agregado.';E.avisoOk=true;guardar();render();
}
function hInvCant(prodId,cant){
  var tipo=E.movTipo,tipoDb=tipo==='entrada'?'entrada':'salida',motivo=tipo==='entrada'?'compra':'labor';
  encolar('movimientos_inventario','crear',uuid(),{producto_id:prodId,tipo:tipoDb,motivo:motivo,fecha:fechaBog(),cantidad:tipo==='entrada'?cant:-cant});
  var pr=datos.stock.find(function(x){return x.producto_id===prodId});
  if(pr)pr.stock=(pr.stock||0)+(tipo==='entrada'?cant:-cant);
  E.aviso=(tipo==='entrada'?'Entraron ':'Salieron ')+cant+(pr?' '+pr.unidad+' de '+pr.nombre:'')+'.'  ;E.avisoOk=true;
  E.movProd=null;E.movTipo=null;guardar();render();
}
function hSalir(){if(sb)sb.auth.signOut().catch(function(){});yo=null;localStorage.removeItem(LS_YO);E={pantalla:'login',tab:'hoy',subAg:null,paso:'inicio',selAct:null,selPot:null,rechazando:null,corrigiendo:null,gAcc:null,gLote:null,gVer:null,gNuevo:false,movProd:null,movTipo:null,selSocio:null,desactivando:null,f:{},aviso:'',avisoOk:false};render()}

/* ─── Arranque ─── */
function arrancar(){
  cargar();render();
  var clave=localStorage.getItem(LS_KEY);
  if(!clave){E.pantalla='setup';render();return}
  sb=conectar(clave);
  if(!sb){E.pantalla='setup';E.aviso='Clave inválida.';render();return}
  sb.rpc('estado_instalacion').then(function(r){
    if(r.error){
      if(yo){irApp();flush();return}
      E.pantalla='login';E.aviso='No se pudo conectar. Verifique su señal.';render();return;
    }
    if(!r.data.instalado){E.pantalla='instalar';render();return}
    dominio=r.data.dominio_usuarios||'ganaderia-elbledo.app';localStorage.setItem(LS_DOM,dominio);
    return sb.auth.getSession().then(function(r2){
      if(r2.data&&r2.data.session&&yo){irApp();flush();refrescar();return}
      E.pantalla='login';render();
    });
  }).catch(function(){
    if(yo){irApp();flush();return}
    E.pantalla='login';E.aviso='Sin señal.';render();
  });
}
function irApp(){
  E.pantalla=yo.rol==='admin'?'admin':(yo.rol==='revisor'?'revisor':'socio');
  E.tab=yo.rol==='admin'?'aprobar':(yo.rol==='revisor'?'milabor':'hoy');
  render();
}
setInterval(function(){if(labAbierta())render()},30000);
setInterval(function(){flush()},60000);
window.addEventListener('online',function(){flush();refrescar()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){});
arrancar();
</script>
