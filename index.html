/* ─── Utilidades ─── */

function fechaBog(){var d=new Date(),b=new Date(d.toLocaleString('en-US',{timeZone:'America/Bogota'}));return b.getFullYear()+'-'+p2(b.getMonth()+1)+'-'+p2(b.getDate())}
function p2(n){return n<10?'0'+n:''+n}

function horaC(iso){if(!iso)return'';var d=new Date(iso),h=d.getHours(),m=d.getMinutes(),s=h<12?'a. m.':'p. m.';return(h%12||12)+':'+p2(m)+' '+s}
function fechaTxt(iso){if(!iso)return'';var M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],p=iso.split('-');return parseInt(p[2],10)+' '+M[parseInt(p[1],10)-1]}

function comprobarSolape(pid,desde,hasta,alTerminar){

}

    if(op==='crear'){datos.labores.push(Object.assign({id:id,registrado_por:yo&&yo.persona_id},payload,{estado:'pendiente',alertas:[]}))}

  }
  if(tabla==='aportes'){
    if(op==='crear'){var rp=yo&&yo.persona_id;datos.aportes.push(Object.assign({id:id},payload,{estado:'pendiente',registrado_por:rp,nombre:nomPers(payload.persona_id),registrado_por_nombre:nomPers(rp)}))}

  }
  if(tabla==='personas'&&op==='crear'){datos.personas.push(Object.assign({id:id,activo:true},payload))}
}

  if(!res)return'red';
  if(res.error){var c=res.error.code||'',s=res.status||0;
    if(s===401)return'auth';if(s===0||s===408||s===429||s>=500)return'red';
    if(PG_NEG.indexOf(c)>=0)return'negocio';if(s>=400)return'negocio';}
  return'ok';
}
function ejecutar(item){
  if(!sb)return Promise.resolve({error:{message:'Sin conexión'},status:0});
  if(item.op==='crear'){
    return sb.from(item.tabla).upsert([Object.assign({id:item.id},item.payload)],{onConflict:'id',ignoreDuplicates:true}).select('id').then(function(r){return{data:r.data,error:r.error,status:r.error?(r.error.status||400):200}});
  }
  if(item.op==='editar'){
    return sb.from(item.tabla).update(item.payload).eq('id',item.id).select('id').then(function(r){
      if(!r.error&&(!r.data||r.data.length===0))return{data:r.data,error:{message:'El servidor no aplicó el cambio. Puede que no tenga permiso o el registro no existe.',code:'no_visible'},status:400};
      return{data:r.data,error:r.error,status:r.error?(r.error.status||400):200};
    });
  }
  if(item.op==='anular'){
    var p=Object.assign({deleted_at:isoNow()},item.payload);
    return sb.from(item.tabla).update(p).eq('id',item.id).select('id').then(function(r){
      if(!r.error&&(!r.data||r.data.length===0))return{data:r.data,error:{message:'No se pudo anular.',code:'no_visible'},status:400};
      return{data:r.data,error:r.error,status:r.error?(r.error.status||400):200};
    });
  }
  return Promise.resolve({error:{message:'Operación desconocida'},status:400});
}
function arrastrar(idL){
  cola.forEach(function(i){
    if(i.estado==='pend'&&i.deps.indexOf(idL)>=0){i.estado='revisar';i.error='Depende de un registro que falló.';arrastrar(i.id_local)}
  });
}
function flush(){
  if(flushing||!sb)return;flushing=true;
  var t0=Date.now();
  function paso(){
    var idx=cola.findIndex(function(i){return i.estado==='pend'});
    if(idx<0){flushing=false;guardar();return}
    var item=cola[idx];
    if(item.deps.some(function(d){return cola.some(function(c){return c.id_local===d&&c.estado==='pend'})})){flushing=false;guardar();return}
    if(item.deps.some(function(d){return cola.some(function(c){return c.id_local===d&&c.estado==='revisar'})})){
      item.estado='revisar';item.error='Depende de un registro que no se pudo enviar.';guardar();render();paso();return;
    }
    item.estado='enviando';
    ejecutar(item).then(function(res){
      var tipo=clasificar(res);
      if(tipo==='ok'){cola.splice(cola.indexOf(item),1)}
      else if(tipo==='red'){item.estado='pend';flushing=false;guardar();return}
      else if(tipo==='auth'){item.estado='pend';E.pantalla='login';E.aviso='Su sesión expiró. Entre de nuevo.';flushing=false;guardar();render();return}
      else{item.estado='revisar';item.error=res.error?res.error.message:'Error desconocido';arrastrar(item.id_local)}
      guardar();render();
      if(Date.now()-t0<8000)paso();else flushing=false;
    }).catch(function(e){item.estado='pend';flushing=false;guardar()});
  }
  paso();
}
function nPend(){return cola.filter(function(i){return i.estado==='pend'||i.estado==='enviando'}).length}
function nRev(){return cola.filter(function(i){return i.estado==='revisar'}).length}

/* ─── Sincronización ─── */
function refrescar(){
  if(!sb||!yo)return Promise.resolve();
  var prom=[];
  function sinc(nombre,from,filtro,campo){
    var q=sb.from(from).select('*');q=filtro(q);
    var ult=ultimoSync[nombre];
    if(ult){var desde=new Date(new Date(ult).getTime()-300000).toISOString();q=q.gte('updated_at',desde)}
    return q.then(function(r){
      if(!r.error&&r.data&&r.data.length>0){
        if(!ult){datos[campo]=r.data}
        else{var m=new Map(datos[campo].map(function(x){return[x.id,x]}));r.data.forEach(function(x){m.set(x.id,x)});datos[campo]=Array.from(m.values())}
      }
      ultimoSync[nombre]=new Date().toISOString();
    }).catch(function(){});
  }
  prom.push(sinc('actividades','catalogos',function(q){return q.eq('tipo','actividad').order('orden')},'actividades'));
  prom.push(sinc('potreros','potreros',function(q){return q.eq('activo',true).order('codigo')},'potreros'));
  prom.push(sinc('jornales','jornales',function(q){return q.order('anio',{ascending:false})},'jornales'));
  if(yo.rol==='admin'||yo.rol==='revisor'){
    prom.push(sinc('personas','personas',function(q){return q.order('nombre')},'personas'));
    prom.push(sb.from('v_ganado_lote').select('*').then(function(r){if(!r.error&&r.data)datos.ganadoLotes=r.data}).catch(function(){}));
    prom.push(sb.from('v_capital_persona').select('*').then(function(r){if(!r.error&&r.data)datos.capitalPersona=r.data}).catch(function(){}));
    prom.push(sb.from('v_stock').select('*').then(function(r){if(!r.error&&r.data)datos.stock=r.data}).catch(function(){}));
  }
  var qAp=sb.from('v_aportes').select('*');
  if(yo.rol==='socio')qAp=qAp.eq('persona_id',yo.persona_id);
  prom.push(qAp.order('fecha',{ascending:false}).limit(200).then(function(r){if(!r.error&&r.data)datos.aportes=r.data}).catch(function(){}));
  var hoy=fechaBog();
  var qL=sb.from('labores').select('*');
  if(yo.rol==='socio')qL=qL.eq('persona_id',yo.persona_id);
  prom.push(qL.gte('fecha',hoy.slice(0,8)+'01').is('deleted_at',null).order('fecha',{ascending:false}).limit(200).then(function(r){
    if(r.data){
      var rescate=datos.labores.slice();
      if(datos.labores.length>10&&r.data.length===0){console.warn('Respuesta sospechosa: 0 labores donde había muchas.')}
      else{var m=new Map(r.data.map(function(l){return[l.id,l]}));datos.labores.filter(function(l){return!m.has(l.id)&&cola.some(function(c){return c.id===l.id&&c.estado==='pend'})}).forEach(function(l){m.set(l.id,l)});datos.labores=Array.from(m.values())}
    }
  }).catch(function(){}));
  prom.push(sb.rpc('mis_alertas').then(function(r){if(r.data)datos.alertas=r.data}).catch(function(){}));
  prom.push(sb.from('config').select('*').limit(50).then(function(r){if(r.data){var m={};r.data.forEach(function(c){m[c.clave]=c.valor});datos.config=m}}).catch(function(){}));
  return Promise.all(prom).then(function(){guardar();render()}).catch(function(){});
}

/* ─── Handlers ─── */
function hInstalar(){
  var f=E.f;if(!f.f_codigo||!f.f_nombre||!f.f_usuario||!f.f_clave){E.aviso='Llene todos los campos.';render();return}
  if(f.f_clave.length<8){E.aviso='La clave debe tener 8+ caracteres.';render();return}
  E.aviso='Creando…';render();
  sb.functions.invoke('instalar',{body:{codigo:f.f_codigo,nombre:f.f_nombre,usuario:f.f_usuario,clave:f.f_clave}}).then(function(r){
    if(r.error||(r.data&&r.data.error)){E.aviso=(r.data&&r.data.error)||r.error.message||'Error.';render();return}
    E.aviso='';E.pantalla='login';E.f={};render();
  }).catch(function(e){E.aviso=e.message||'Error de red.';render()});
}
function hEntrar(){
  var usr=(E.f.f_user||'').trim(),pass=E.f.f_pass||'';
  if(!usr||!pass){E.aviso='Escriba usuario y clave.';render();return}
  E.aviso='Entrando…';render();
  var email=aCorreo(usr,dominio);
  sb.auth.signInWithPassword({email:email,password:pass}).then(function(r){
    if(r.error){E.aviso=r.error.message==='Invalid login credentials'?'Usuario o clave incorrectos.':r.error.message;render();return}
    return sb.rpc('vincular_mi_cuenta').then(function(r2){
      if(r2.error||!r2.data||!r2.data.ok){E.aviso=r2.data&&r2.data.ok===false?'Su cuenta no está autorizada; pida acceso al administrador.':(r2.error?r2.error.message:'Error.');render();return}
      yo={persona_id:r2.data.persona_id,rol:r2.data.rol,nombre:usr};
      return sb.from('personas').select('nombre').eq('id',r2.data.persona_id).single().then(function(r3){if(r3.data)yo.nombre=r3.data.nombre}).catch(function(){}).then(function(){
        localStorage.setItem(LS_YO,JSON.stringify(yo));E.f={};E.aviso='';
        E.pantalla=yo.rol==='admin'?'admin':(yo.rol==='revisor'?'revisor':'socio');
        E.tab=yo.rol==='admin'?'aprobar':(yo.rol==='revisor'?'milabor':'hoy');
        render();refrescar();
      });
    });
  }).catch(function(e){E.aviso=e.message||'Error de red.';render()});
}
function hEmpezar(){
  if(labAbierta()){E.aviso='Ya tiene una labor abierta. Termínela primero.';E.paso='inicio';render();return}
  var id=uuid(),potId=E.selPot==='null'?null:E.selPot;
  encolar('labores','crear',id,payloadEmpezar(yo.persona_id,fechaBog(),E.selAct,isoNow(),potId));E.paso='inicio';E.aviso='';
}
function hTerminar(){
  var ab=labAbierta();if(!ab){E.aviso='No hay labor abierta.';render();return}
  var empItem=cola.find(function(c){return c.id===ab.id&&c.op==='crear'});
  var deps=empItem?[empItem.id_local]:[];
  encolar('labores','editar',ab.id,payloadTerminar(isoNow()),deps);
  var mt=minEntre(ab.inicio,new Date().toISOString());
  E.aviso=nomAct(ab.actividad_id)+', '+durM(mt)+'. Guardado.';E.avisoOk=true;
}
function hAgregarAct(){
  var n=(E.f.f_nact||'').trim();if(!n){E.aviso='Escriba el nombre.';render();return}
  var id=uuid(),pl=payloadCrearActividad(n,100,true);encolar('catalogos','crear',id,pl);
  datos.actividades.push(Object.assign({id:id},pl));
  E.f.f_nact='';E.aviso='«'+n+'» agregada.';E.avisoOk=true;guardar();render();
}
function hAgregarPot(){
  var n=(E.f.f_nlote||'').trim();if(!n){E.aviso='Escriba el nombre.';render();return}
  var id=uuid(),ha=numP(E.f.f_nha)||null,pl2=payloadCrearPotrero(n.toUpperCase(),n,ha);
  encolar('potreros','crear',id,pl2);
  datos.potreros.push(Object.assign({id:id,activo:true},pl2));
  E.f.f_nlote='';E.f.f_nha='';E.aviso='Lote «'+n+'» agregado.';E.avisoOk=true;guardar();render();
}
function hGGuardar(loteId){
  var acc=E.gAcc,n=parseInt(E.f.f_gn,10);
  if(!(n>0)){E.aviso='Escriba cuántos animales.';render();return}
  if(acc==='entrada'){
    var kg=numP(E.f.f_gkg),pre=numP(E.f.f_gpre);if(!(kg>0&&pre>0)){E.aviso='Escriba peso y precio.';render();return}
    encolar('entradas_ganado','crear',uuid(),payloadEntradaGanado(loteId,fechaBog(),n,kg,pre));E.aviso='Entraron '+n+' animales.';
  }
  if(acc==='pesaje'){
    var kg2=numP(E.f.f_gkg);if(!(kg2>0)){E.aviso='Escriba el peso promedio.';render();return}
    encolar('pesajes_lote','crear',uuid(),payloadPesaje(loteId,fechaBog(),n,kg2));E.aviso='Pesaje guardado.';
  }
  if(acc==='venta'){
    var kg3=numP(E.f.f_gkg),pre3=numP(E.f.f_gpre);if(!(kg3>0&&pre3>0)){E.aviso='Escriba peso y precio.';render();return}
    encolar('ventas','crear',uuid(),payloadVenta(loteId,fechaBog(),n,kg3,pre3));E.aviso='Venta guardada.';
  }
  if(acc==='baja'){
    encolar('bajas_ganado','crear',uuid(),payloadBaja(loteId,fechaBog(),n,E.f.f_gcausa||'Murió'));E.aviso='Baja registrada.';
  }
  E.avisoOk=true;E.gAcc=null;E.gLote=null;
}
function hGHist(loteId){
  if(E.gVer===loteId){E.gVer=null;render();return}
  E.gVer=loteId;
  if(sb)sb.from('v_ganado_historial').select('*').eq('lote_id',loteId).order('fecha',{ascending:false}).limit(50).then(function(r){if(r.data)datos.ganadoHist[loteId]=r.data;render()}).catch(function(){render()});
  else render();
}
function hGCrear(){
  var n=(E.f.f_gnom||'').trim();if(!n){E.aviso='Escriba el nombre.';render();return}
  E.aviso='Creando…';render();
  var pct=E.f.f_gcont==='null'?null:parseInt(E.f.f_gcont,10);
  sb.rpc('lote_ganado_crear',{p_nombre:n,p_pct_empresa:pct}).then(function(r){
    if(r.error){E.aviso=r.error.message;render();return}
    E.gNuevo=false;E.aviso='Lote «'+n+'» creado. Registre los animales con «+ Entraron».';E.avisoOk=true;
    refrescar();
  }).catch(function(e){E.aviso=e.message;render()});
}
function hCrearSocio(){
  var n=(E.f.f_pnom||'').trim(),u=(E.f.f_pusr||'').trim().toLowerCase();
  if(!n||u.length<3){E.aviso='Nombre y usuario (3+ letras).';render();return}
  var clave=E.f.f_pclave;E.aviso='Creando…';render();
  sb.functions.invoke('usuarios',{body:{accion:'crear',nombre:n,usuario:u,clave:clave,rol:'socio'}}).then(function(r){
    if(r.error||(r.data&&r.data.error)){E.aviso=(r.data&&r.data.error)||r.error.message||'Error.';render();return}
    E.f.f_pnom='';E.f.f_pusr='';E.f.f_pclave='';E.aviso=n+' creado. Clave: '+clave;E.avisoOk=true;refrescar();
  }).catch(function(e){E.aviso=e.message;render()});
}
function hCambiarRol(id,rol){
  E.aviso='Cambiando…';render();
  sb.from('personas').update({rol:rol}).eq('id',id).select('id').then(function(r){
    if(r.error){E.aviso=r.error.message;render();return}
    if(!r.data||!r.data.length){E.aviso='Sin permiso.';render();return}
    var p=datos.personas.find(function(x){return x.id===id});if(p)p.rol=rol;
    E.aviso='Rol cambiado.';E.avisoOk=true;guardar();render();
  }).catch(function(e){E.aviso=e.message;render()});
}
function hNuevaClave(id){
  var c=genClave();E.aviso='Cambiando clave…';render();
  var p=datos.personas.find(function(x){return x.id===id});
  sb.functions.invoke('usuarios',{body:{accion:'restablecer_clave',persona_id:id,clave:c}}).then(function(r){
    if(r.error||(r.data&&r.data.error)){E.aviso=(r.data&&r.data.error)||r.error.message||'Error.';render();return}
    if(p)p._claveNueva=c;E.aviso='Clave: '+c+'. Désela en persona.';E.avisoOk=true;render();
  }).catch(function(e){E.aviso=e.message;render()});
}
function hDesactivar(id,motivo){
  E.aviso='Procesando…';E.desactivando=null;render();
  sb.functions.invoke('usuarios',{body:{accion:'desactivar',persona_id:id,motivo:motivo}}).then(function(r){
    if(r.error||(r.data&&r.data.error)){E.aviso=(r.data&&r.data.error)||r.error.message||'Error.';render();return}
    var p=datos.personas.find(function(x){return x.id===id});if(p)p.activo=false;
    E.aviso=p?p.nombre+' desactivado.':'Desactivado.';E.avisoOk=true;guardar();render();
  }).catch(function(e){E.aviso=e.message;render()});
}
function hReactivar(id){
  E.aviso='Procesando…';render();
  sb.functions.invoke('usuarios',{body:{accion:'reactivar',persona_id:id}}).then(function(r){
    if(r.error||(r.data&&r.data.error)){E.aviso=(r.data&&r.data.error)||r.error.message||'Error.';render();return}
    var p=datos.personas.find(function(x){return x.id===id});if(p)p.activo=true;
    E.aviso=p?p.nombre+' activado.':'Activado.';E.avisoOk=true;guardar();render();
  }).catch(function(e){E.aviso=e.message;render()});
}
function hAgregarProd(){
  var n=(E.f.f_inom||'').trim();if(!n){E.aviso='Escriba el nombre.';render();return}
  var id=uuid(),un=E.f.f_iun||'kg';
  encolar('productos','crear',id,payloadCrearProducto(n,un));
  datos.stock.push({producto_id:id,nombre:n,unidad:un,stock:0});
  E.f.f_inom='';E.aviso='«'+n+'» agregado.';E.avisoOk=true;guardar();render();
}
function hInvCant(prodId,cant){
  var tipo=E.movTipo,tipoDb=tipo==='entrada'?'entrada':'salida',motivo=tipo==='entrada'?'compra':'labor';
  encolar('movimientos_inventario','crear',uuid(),payloadMovInventario(prodId,tipoDb,motivo,fechaBog(),tipo==='entrada'?cant:-cant));
  var pr=datos.stock.find(function(x){return x.producto_id===prodId});
  if(pr)pr.stock=(pr.stock||0)+(tipo==='entrada'?cant:-cant);
  E.aviso=(tipo==='entrada'?'Entraron ':'Salieron ')+cant+(pr?' '+pr.unidad+' de '+pr.nombre:'')+'.'  ;E.avisoOk=true;
  E.movProd=null;E.movTipo=null;guardar();render();
}
function hGuardarTrabajo(){
  var pid=E.f.f_tsocio,fecha=E.f.f_tfecha||fechaBog();
  var dias=E.f.f_tdias||'uno',hasta=dias==='varios'&&E.f.f_thasta?E.f.f_thasta:null;
  var jorn=parseInt(E.f.f_tjorn||'0',10),horas=parseInt(E.f.f_thoras||'0',10);
  var totalH=jorn*7+horas;
  E.avisoOk=false;
  if(!pid){E.aviso='Seleccione un socio.';render();return}
  if(totalH<1){E.aviso='Ingrese al menos 1 hora de trabajo.';render();return}
  if(!E.f.f_tact){E.aviso='Seleccione una actividad.';render();return}
  if(dias==='varios'&&!hasta){E.aviso='Indique la fecha final.';render();return}
  if(hasta&&hasta<fecha){E.aviso='La fecha final debe ser después de la inicial.';render();return}
  if(hasta===fecha)hasta=null;
  var sol=estadoSolape(pid,fecha,hasta||fecha);
  if(sol.remoto&&!sol.comprobado){
    comprobarSolape(pid,fecha,hasta||fecha,function(){
      if(E.subAg!=='trabajo'||E.pasoT!=='form'){render();return}
      var s2=estadoSolape(pid,fecha,hasta||fecha);
      if(!s2.err&&!s2.n)hGuardarTrabajo();else render();
    });
    return;
  }
  var potId=(!E.f.f_tpot||E.f.f_tpot==='null')?null:E.f.f_tpot;
  encolar('labores','crear',uuid(),payloadLaborTardia(pid,fecha,hasta,totalH,E.f.f_tact,potId,E.f.f_tobs||null));
  E.subAg=null;E.pasoT='socio';E.f.f_tcomp=null;E.aviso='Trabajo de '+nomPers(pid)+' guardado.';E.avisoOk=true;render();
}
function hGuardarAporte(){
  var pid=E.f.f_asocio,nuevo=E.f.f_anuevo,fecha=E.f.f_afecha||fechaBog(),valor=numP(E.f.f_avalor),forma=E.f.f_aforma||null;
  E.avisoOk=false;
  if(!pid&&!nuevo){E.aviso='Seleccione un socio.';render();return}
  if(!(valor>0)){E.aviso='Ingrese el valor del aporte.';render();return}
  if(!forma){E.aviso='Escoja cómo entró el dinero.';render();return}
  if(forma==='efectivo'&&!E.f.f_arecibido){E.aviso='Indique quién recibió el efectivo.';render();return}
  if(forma==='directo'&&!(E.f.f_adesc||'').trim()){E.aviso='Describa el pago directo.';render();return}
  var deps=[];
  if(nuevo){pid=uuid();deps=[encolar('personas','crear',pid,payloadPersonaAportante(nuevo))]}
  encolar('aportes','crear',uuid(),payloadAporte(pid,fecha,valor,forma,forma==='efectivo'?E.f.f_arecibido:null,forma==='directo'?(E.f.f_adesc||'').trim():null,(E.f.f_asoporte||'').trim()||null),deps);
  E.subAg=null;E.pasoA='socio';E.f.f_anuevo=null;E.aviso='Aporte de '+pesos(valor)+' de '+nomPers(pid)+' guardado.';E.avisoOk=true;render();
}
function hVerificarTodos(pid){
  var pendA=datos.aportes.filter(function(a){return a.estado==='pendiente'&&a.persona_id===pid&&puedeVerificar(a)});
  pendA.forEach(function(a){encolar('aportes','editar',a.id,payloadVerificarAporte())});
  E.aviso=pendA.length+' aporte(s) verificado(s).';E.avisoOk=true;render();
}
function hGuardarNota(labId){
  var nota=(E.f.f_nota||'').trim();
  var empItem=cola.find(function(c){return c.id===labId&&c.op==='crear'});
  var deps=empItem?[empItem.id_local]:[];
  encolar('labores','editar',labId,payloadNota(nota||null),deps);
  E.editandoNota=null;E.aviso=nota?'Nota guardada.':'Nota eliminada.';E.avisoOk=true;render();
}
function hDarAcceso(pid){
  var usr=(E.f.f_da_usr||'').trim().toLowerCase(),clave=E.f.f_da_clave;
  if(usr.length<3){E.aviso='El usuario debe tener 3+ letras.';render();return}
  E.aviso='Creando acceso…';render();
  sb.functions.invoke('usuarios',{body:payloadDarAcceso(pid,usr,clave)}).then(function(r){
    if(r.error||(r.data&&r.data.error)){E.aviso=(r.data&&r.data.error)||r.error.message||'Error.';render();return}
    var p=datos.personas.find(function(x){return x.id===pid});
    if(p){p.user_id='temp';p._accesoOk=clave}
    E.dandoAcceso=null;E.aviso='Acceso creado. Clave: '+clave;E.avisoOk=true;render();refrescar();
  }).catch(function(e){E.aviso=e.message;render()});
}
function hSalir(){if(sb)sb.auth.signOut().catch(function(){});yo=null;localStorage.removeItem(LS_YO);E={pantalla:'login',tab:'hoy',subAg:null,paso:'inicio',pasoT:'socio',pasoA:'socio',selAct:null,selPot:null,rechazando:null,corrigiendo:null,gAcc:null,gLote:null,gVer:null,gNuevo:false,movProd:null,movTipo:null,selSocio:null,desactivando:null,editandoNota:null,verAporteGrupo:null,rechAporte:null,dandoAcceso:null,f:{},aviso:'',avisoOk:false};render()}

/* ─── Arranque ─── */
function arrancar(){
  cargar();render();
  try{localStorage.removeItem('eb_key')}catch(e){}
  sb=conectar();
  sb.rpc('estado_instalacion').then(function(r){
    if(r.error){
      if(yo){irApp();flush();return}
      E.pantalla='login';E.aviso='No se pudo conectar. Verifique su señal.';render();return;
    }
    if(!r.data.instalado){E.pantalla='instalar';render();return}
    dominio=r.data.dominio_usuarios||'ganaderia-elbledo.app';localStorage.setItem(LS_DOM,dominio);
    return sb.auth.getSession().then(function(r2){
      if(r2.data&&r2.data.session&&yo){irApp();flush();refrescar();return}
      E.pantalla='login';render();
    });
  }).catch(function(){
    if(yo){irApp();flush();return}
    E.pantalla='login';E.aviso='Sin señal.';render();
  });
}
function irApp(){
  E.pantalla=yo.rol==='admin'?'admin':(yo.rol==='revisor'?'revisor':'socio');
  E.tab=yo.rol==='admin'?'aprobar':(yo.rol==='revisor'?'milabor':'hoy');
  render();
}
setInterval(function(){if(labAbierta())render()},30000);
setInterval(function(){flush()},60000);
window.addEventListener('online',function(){flush();refrescar()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){});
arrancar();
</script>
